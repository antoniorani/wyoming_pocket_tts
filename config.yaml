---
# Home Assistant App Configuration
# https://developers.home-assistant.io/docs/apps/configuration/

name: Wyoming Pocket TTS (antoniorani)
version: 1.5.0
slug: wyoming_pocket_tts
description: >-
    Local text-to-speech with configurable quality, preset voice selection,
    and custom voice cloning using Kyutai Pocket TTS.
url: https://github.com/antoniorani/wyoming_pocket_tts
arch:
    - amd64
    - aarch64

# Startup configuration
init: false
startup: application
boot: auto

# Auto-discovery via Wyoming protocol
discovery:
    - wyoming

# Network
ports:
    10200/tcp:
ports_description:
    10200/tcp: Wyoming protocol

# Host access
host_network: false
hassio_api: false
homeassistant_api: false

# Storage
map:
    - share:rw # Custom voice samples in /share/tts-voices

# Keep upgrade-safe defaults compatible with releases <=1.4.9. The recommended
# Spanish quality setup is es_24l + lola + high; users can select it directly in
# the Configuration tab after upgrading.
options:
    language: en
    preset_voices: []
    custom_voices: []
    # Backward-compatible free-form list used by releases <= 1.4.9. New installs
    # should normally move built-in choices to preset_voices.
    voices:
        - alba
    quality: balanced
    voices_dir: /share/tts-voices
    device: cpu
    hf_token: ''
    debug: false

schema:
    language: list(en|fr|de|pt|it|es|fr_24l|de_24l|pt_24l|it_24l|es_24l)
    # Each array item is a Home Assistant dropdown instead of a free-text field.
    preset_voices:
        - list(alba|anna|azelma|bill_boerst|caro_davy|charles|cosette|eponine|eve|fantine|george|jane|jean|javert|marius|mary|michael|paul|peter_yearsley|stuart_bell|vera|estelle|juergen|rafael|giovanni|lola)
    custom_voices:
        - str
    # Kept so existing saved configurations remain valid after upgrading.
    voices:
        - str
    quality: list(fast|balanced|high|maximum)
    voices_dir: str
    device: list(cpu|cuda)
    hf_token: password?
    debug: bool

# Panel
panel_icon: mdi:text-to-speech
panel_title: Pocket TTS

# Build from source in Home Assistant. For a future prebuilt multi-arch image:
# image: ghcr.io/antoniorani/wyoming_pocket_tts
